databases:
  - name: athlenet-db
    databaseName: athlenet
    user: athlenet
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: athlenet-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: athlenet_fullstack_updated/athlenet_fullstack/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python -m gunicorn athlenet.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: athlenet-db
          property: connectionString

  - type: web
    name: athlenet-frontend
    runtime: static
    rootDir: athlenet_fullstack_updated/athlenet_fullstack/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://athlenet-backend.onrender.com/api
